# QA Wolf build check. On every pull request (GitHub runs it on the pull request merged into its base),
# install the web app clean (npm ci in web/) and build it (tsc -b && vite build).
# QA Wolf's flows assert this job's "qaw-build" check succeeded on each Novus pull request.
name: qaw-build
on:
  pull_request:
permissions:
  contents: read
jobs:
  qaw-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build
